

name: Build-test


on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "**.json", "**.png", "LICENSE*", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:

  CACHE_VERSION: v1

jobs:
  build-linux:
    name: ${{ matrix.os }} x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - os: ubuntu-22.04
            experimental: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute artifact name
        id: meta
        run: |
          ref="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=mkxp-z.linux.${{ matrix.os }}.x86_64.${ref}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-deps-${{ env.CACHE_VERSION }}-${{ matrix.os }}-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev ccache

   
      - name: Prefetch libiconv and add wget retries
        run: |
          printf '%s\n' 'tries = 5' 'connect_timeout = 20' 'read_timeout = 60' 'waitretry = 10' 'retry_connrefused = on' > ~/.wgetrc
          mkdir -p linux/downloads/x86_64
          f=linux/downloads/x86_64/libiconv-1.18.tar.gz
          if [ ! -s "$f" ]; then
            ok=
            for url in \
              https://mirrors.kernel.org/gnu/libiconv/libiconv-1.18.tar.gz \
              https://ftp.fau.de/gnu/libiconv/libiconv-1.18.tar.gz \
              https://mirrors.dotsrc.org/gnu/libiconv/libiconv-1.18.tar.gz \
              https://mirrors.ocf.berkeley.edu/gnu/libiconv/libiconv-1.18.tar.gz \
              https://mirror.csclub.uwaterloo.ca/gnu/libiconv/libiconv-1.18.tar.gz \
              https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.18.tar.gz
            do
              echo "Probando $url"
              if wget -q --tries=2 --timeout=20 -O "$f.part" "$url" && tar -tzf "$f.part" >/dev/null 2>&1; then
                mv "$f.part" "$f"
                ok=1
                break
              fi
              rm -f "$f.part"
            done
            if [ -z "$ok" ]; then
              echo "::error::No se pudo descargar libiconv-1.18 de ningún espejo"
              exit 1
            fi
          fi
          ls -l "$f"

    
      - name: Build all dependencies
        run: |
          cd linux
          for attempt in 1 2 3; do
            make && exit 0
            [ "$attempt" -lt 3 ] || break
            echo "::warning::make falló (intento $attempt/3); reintentando"
            sleep 20
          done
          exit 1

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.os }}-

      - name: Build executable
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 300M
          CCACHE_COMPRESS: "1"
        run: |
          source linux/vars.sh
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local
          cd build
          ninja
          ninja install
          ccache -s || true

      - name: Prepare archive
        run: |
          cd build/local
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .


      - name: Pack tarball
        run: tar -czf "${{ steps.meta.outputs.name }}.tar.gz" -C build/local .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
